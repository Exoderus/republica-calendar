<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#24382E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calendar">
<title>Republica | 1963 · Calendar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#24382E; --green-2:#33503F; --cream:#F4EFE6; --paper:#FBF8F2; --rust:#B24732; --stone:#9C9286;
    --red:#CB2125; --ink:#1E2420; --muted:#6B706C; --line:#E2DACB; --amber:#C98A1B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .hin{max-width:1100px;margin:0 auto}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
  .brand img{height:22px;width:auto;display:block;max-width:100%}
  .brand span{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--stone);border-left:1px solid rgba(255,255,255,.25);padding-left:10px;white-space:nowrap}
  @media (max-width:420px){ .brand img{height:20px} .brand span{display:none} }
  @media (min-width:800px){ .brand img{height:26px} }
  .iconbtn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;height:34px;min-width:34px;padding:0 9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px}
  .iconbtn:hover{background:rgba(255,255,255,.2)}
  .iconbtn svg{width:17px;height:17px;flex:none}
  .iconbtn .lbl{display:none}
  @media (min-width:700px){ .iconbtn .lbl{display:inline} }
  .tabs{display:flex;gap:3px;margin-top:12px;background:rgba(0,0,0,.18);border-radius:12px;padding:3px;order:10;flex-basis:100%}
  .tab{flex:1;background:transparent;border:0;color:rgba(255,255,255,.8);border-radius:9px;padding:8px 0;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
  .tab:hover{color:#fff}
  .tab .s{display:none}
  @media (max-width:420px){ .tab .l{display:none} .tab .s{display:inline} }
  .newbtn{display:none;background:var(--red);color:#fff;border:0;border-radius:10px;height:34px;padding:0 14px;font-weight:700;font-size:13px;cursor:pointer;align-items:center;gap:6px}
  .newbtn:hover{filter:brightness(1.08)}
  .who{display:none;font-size:12px;font-weight:600;color:rgba(255,255,255,.75);margin:0 4px}
  kbd{font:600 11px Manrope,sans-serif;border:1px solid rgba(0,0,0,.18);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff;color:var(--muted)}
  @media (min-width:1024px){
    header{padding:10px 24px}
    .hin{max-width:1440px}
    .tabs{order:0;flex-basis:auto;margin:0 auto 0 28px;padding:3px}
    .tab{flex:none;padding:7px 16px;font-size:14px}
    .brand{flex:none}
    .newbtn{display:inline-flex}
    .who{display:inline}
    .fab{display:none !important}
    main{max-width:1440px !important;padding:18px 24px 60px !important}
    .filters{padding:10px max(24px, calc((100vw - 1440px) / 2 + 24px)) !important}
    .narrow{max-width:880px;margin:0 auto}
    .overlay{align-items:stretch !important;justify-content:flex-end !important;background:rgba(20,28,24,.28)}
    .sheet{max-width:none !important;width:min(640px,100vw) !important;max-height:none !important;height:100vh;border-radius:0 !important;padding:26px 30px 40px !important;box-shadow:-12px 0 32px rgba(0,0,0,.18);animation:slidein .16s ease-out}
    .sheet.wide{width:min(860px,100vw) !important}
    .sheet h3{font-size:24px}
  }
  @keyframes slidein{from{transform:translateX(40px);opacity:.4}}
  body.ro .newbtn{display:none !important}
  .card:hover{box-shadow:0 2px 8px rgba(36,56,46,.14),0 0 0 1px rgba(36,56,46,.06)}
  .tab.on{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .filters{display:flex;gap:6px;overflow-x:auto;padding:10px max(14px, calc((100vw - 1100px) / 2 + 12px));background:var(--paper);border-bottom:1px solid var(--line);scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.off{opacity:.4}
  .chip select{border:0;background:transparent;font-weight:600;font-size:13px;padding:0;outline:none}
  main{max-width:1100px;margin:0 auto;padding:12px 12px 110px}
  .search{display:block;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;margin-bottom:12px}
  /* Agenda */
  .dayhead{font-family:Fraunces,serif;font-weight:600;font-size:16px;margin:18px 4px 8px;color:var(--green);display:flex;justify-content:space-between;align-items:baseline}
  .dayhead .today{font-family:Manrope;font-size:12px;font-weight:700;color:#fff;background:var(--red);border-radius:6px;padding:2px 7px}
  .card{display:flex;background:#fff;border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 2px rgba(36,56,46,.08),0 0 0 1px rgba(36,56,46,.04);cursor:pointer;transition:transform .08s}
  .card:active{transform:scale(.99)}
  .card .bar{width:6px;flex:none}
  .card .body{padding:10px 12px;flex:1;min-width:0}
  .card .time{font-size:13px;font-weight:700;color:var(--muted)}
  .card .title{font-weight:700;font-size:16px;margin:2px 0;overflow-wrap:anywhere}
  .card .meta{font-size:13px;color:var(--muted)}
  .card.cancel .title{text-decoration:line-through;color:var(--muted)}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
  .b-Opțiune{background:#FADCE3;color:#9B1C3C}
  .b-Confirmat{background:#DDEBE3;color:var(--green)}
  .b-Montaj{background:#ECE6DA;color:#5C5246}
  .b-Anulat{background:#EEE;color:#777}
  .b-exp{background:#F6DAD7;color:var(--red)}
  .alert{background:#fff;border-left:4px solid var(--red);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px;cursor:pointer}
  .alert b{color:var(--red)}
  .pill.expired{border-color:var(--red) !important;color:var(--red)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .linkbtn{display:block;margin:14px auto;background:none;border:1px dashed var(--line);border-radius:10px;padding:9px 14px;color:var(--green);font-weight:600;cursor:pointer}
  /* Luna */
  .monthnav{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}
  .monthnav h2{font-family:Fraunces,serif;margin:0;font-size:20px;color:var(--green)}
  .navbtn{border:1px solid var(--line);background:#fff;border-radius:10px;height:36px;min-width:40px;cursor:pointer;font-weight:700}
  .prow{border-left:4px solid var(--stone);background:#fff;border-radius:8px;padding:8px 12px;margin:8px 0;cursor:pointer}
  .prow:hover{background:#F4F1EA} .prow .t{font-size:15px;font-weight:600;margin-top:2px}
  .btn:disabled{opacity:.45;cursor:default}
  input.tm-in{font-variant-numeric:tabular-nums} input.tm-in.bad{border-color:var(--red);background:#FCEDEB}
  .dayhead.flash{animation:flash 1.5s ease-out} @keyframes flash{0%,40%{background:#FADCE3}100%{background:transparent}}
  table.adus{width:100%;border-collapse:collapse;font-size:14px} table.adus th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)} table.adus td{padding:7px 8px;border-bottom:1px solid #EEE8DD}
  table.adus tr.arow td{font-size:13px;color:var(--muted);padding:4px 8px 4px 22px;cursor:pointer} table.adus tr.arow:hover td{background:#F6F2EA}
  .navbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
  .bnav{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .wd{font-size:11px;font-weight:700;text-align:center;color:var(--muted);padding:4px 0}
  .cell{background:#fff;border-radius:8px;min-height:74px;padding:4px;cursor:pointer;overflow:hidden;border:2px solid transparent}
  .cell.out{opacity:.4}
  .cell.today .n{background:var(--red);color:#fff;border-radius:999px;display:inline-block;min-width:21px;text-align:center;padding:1px 6px}
  .cell.sel{border-color:var(--green)}
  .cell .n{font-size:12px;font-weight:700;margin-bottom:2px}
  .pill{font-size:10.5px;line-height:1.25;color:#fff;border-radius:4px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill.opt{background:#FADCE3 !important;border:1px dashed;border-left:4px solid;color:#7A1F35}
  .pill.cancel{text-decoration:line-through;opacity:.45}
  .more{font-size:10.5px;color:var(--muted);font-weight:700}
  .daypanel{margin-top:14px}
  .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
  .dots i{width:7px;height:7px;border-radius:50%;display:block}
  .dots i.opt{background:#F2A7B8 !important;border:1.5px dashed}
  .dots i.cancel{opacity:.35}
  @media (max-width:599px){ .cell{min-height:52px;text-align:center} .cell .n{font-size:13px} .dots{justify-content:center} }
  @media (min-width:800px){ .cell{min-height:110px} .pill{font-size:12px} }
  /* Acasă */
  .hello{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:4px 2px 14px}
  .hello h2{font-family:Fraunces,serif;color:var(--green);margin:0;font-size:24px}
  .hello .hint{font-size:13px}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
  .kpi:last-child:nth-child(odd){grid-column:span 2}
  @media (min-width:700px){ .kpis{grid-template-columns:repeat(5,1fr);gap:12px} .kpi:last-child:nth-child(odd){grid-column:auto} }
  @media (max-width:600px){ .panel h4 small{display:none} }
  .kpi{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(36,56,46,.08);cursor:pointer}
  .kpi .k{font-size:12px;font-weight:700;color:var(--muted)}
  .kpi .v{font-family:Fraunces,serif;font-size:26px;font-weight:700;color:var(--green);margin-top:2px;line-height:1.1}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi.bad .v{color:var(--red)}
  .hgrid{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:1024px){ .hgrid{grid-template-columns:1.25fr 1fr 1fr;gap:16px;align-items:start} .span2{grid-column:span 2} .span3{grid-column:span 3} }
  .panel{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(36,56,46,.08)}
  .panel h4{font-family:Fraunces,serif;color:var(--green);font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .panel h4 small{font-family:Manrope;font-size:12px;color:var(--muted);font-weight:600}
  .panel h4 a{font-family:Manrope;font-size:12px;color:var(--green);font-weight:700;cursor:pointer}
  .panel h5{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:14px 0 6px}
  .panel h5:first-of-type{margin-top:0}
  .rowev{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:10px;cursor:pointer}
  .rowev:hover{background:var(--paper)}
  .rowev .t{font-weight:800;font-size:13px;min-width:44px;color:var(--ink);padding-top:1px;text-align:right}
  .rowev .t small{display:block;font-weight:700;font-size:11px;color:var(--muted);text-transform:lowercase}
  .rowev .b{width:4px;align-self:stretch;border-radius:4px;flex:none}
  .rowev .x{flex:1;min-width:0}
  .rowev .x b{display:block;font-size:14px;overflow-wrap:anywhere}
  .rowev .x span{font-size:12px;color:var(--muted)}
  .rowev.cancel b{text-decoration:line-through;color:var(--muted)}
  .nothing{color:var(--muted);font-size:13px;padding:6px 2px}
  .occ{display:grid;grid-template-columns:150px 1fr 90px;gap:8px 12px;align-items:center;font-size:13px}
  .occ .bar{height:10px;background:var(--cream);border-radius:6px;overflow:hidden}
  .occ .bar i{display:block;height:100%;border-radius:6px}
  .occ .n{color:var(--muted);text-align:right;white-space:nowrap}
  @media (max-width:600px){ .occ{grid-template-columns:100px 1fr 70px} }
  .todo{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 6px;border-radius:8px;cursor:pointer}
  .todo:hover{background:var(--paper)}
  .todo i{width:8px;height:8px;border-radius:50%;flex:none}
  .shortcuts{display:none;font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
  @media (min-width:1024px) and (hover:hover){ .shortcuts{display:block} }
  .ready{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin:5px 0 0 6px}
  .ready.ok{background:#DDEBE3;color:var(--green)}
  .ready.part{background:#FBEFD9;color:#8A5A07}
  .ready.bad{background:#F6DAD7;color:var(--red)}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:4px 0}
  .chk i{font-style:normal;font-weight:800;width:18px;flex:none}
  .chk.ok i{color:var(--green)} .chk.no i{color:var(--red)} .chk.wait i{color:#8A5A07}
  .chk.ok span{color:var(--muted)}
  .wb.blk, .rowev.blk .b{background:repeating-linear-gradient(135deg,#ECE7DD 0 6px,#E1DACB 6px 12px)}
  .card.blk{background:repeating-linear-gradient(135deg,#FFFFFF 0 10px,#F7F3EA 10px 20px)}
  /* Brief */
  .brief h3{margin-bottom:2px}
  .brief .bnav{display:flex;gap:6px;align-items:center;margin:8px 0 14px;flex-wrap:wrap}
  .brief table{width:100%;border-collapse:collapse;font-size:13.5px}
  .brief td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .brief td.t{font-weight:800;white-space:nowrap;width:52px}
  .brief td.w{color:var(--muted);white-space:nowrap}
  .brief .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
  .brief .evc{background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;border-left:5px solid}
  .brief .evc b{font-size:15px}
  .brief .evc .m{font-size:13px;color:var(--muted);margin-top:3px}
  .brief .ppl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13.5px}
  .brief .ppl div:nth-child(odd){font-weight:700}
  @media print {
    header, .filters, main, .fab, .toast, .inst, .loading, .noprint{display:none !important}
    body{background:#fff}
    .overlay{position:static !important;display:block !important;background:none !important}
    .sheet{position:static !important;width:auto !important;height:auto !important;max-height:none !important;box-shadow:none !important;padding:0 !important;overflow:visible !important;animation:none !important}
    .brief .evc{break-inside:avoid;border:1px solid #ddd;border-left-width:5px}
  }
  /* Săptămână */
  .wnav{display:flex;align-items:center;gap:8px;margin:2px 2px 12px;flex-wrap:wrap}
  .wnav h2{font-family:Fraunces,serif;margin:0;font-size:20px;color:var(--green);flex:1}
  .wgrid{display:grid;grid-template-columns:150px repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .wgrid .wh{background:var(--paper);padding:8px 10px;font-size:12px;font-weight:700;color:var(--muted)}
  .wgrid .wh b{display:block;font-family:Fraunces,serif;font-size:18px;color:var(--ink)}
  .wgrid .wh.today{background:#fff}
  .wgrid .wh.today b{color:var(--red)}
  .wgrid .sp{background:var(--paper);padding:10px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:flex-start}
  .wgrid .sp i{width:10px;height:10px;border-radius:50%;margin-top:3px;flex:none}
  .wgrid .wc{background:#fff;min-height:84px;padding:5px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
  .wgrid .wc.today{background:#FFFDF8}
  .wgrid .wc:hover{background:#FAF7F0}
  .wgrid .wc .add{display:none;color:var(--muted);font-size:12px;font-weight:700;text-align:center;padding:4px;border:1px dashed var(--line);border-radius:8px;margin-top:auto}
  .wgrid .wc:hover .add{display:block}
  body.ro .wgrid .wc .add{display:none !important}
  .wb{border-radius:8px;padding:5px 7px;font-size:12px;line-height:1.3;border-left:4px solid;background:#E4EEE8;cursor:pointer}
  .wb:hover{filter:brightness(.97)}
  .wb .tm{font-weight:800;font-size:11.5px;color:var(--muted)}
  .wb .tt{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .wb.opt{background:#FADCE3;border-left-style:dashed;box-shadow:inset 0 0 0 1px #F2B8C6}
  .card.opt{background:#FDF0F3}
  .legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12.5px;color:var(--muted);margin:10px 2px 0}
  .legend i{display:inline-block;width:22px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
  .legend i.c{background:var(--green)} .legend i.o{background:#FADCE3;border:1px dashed var(--green);border-left:4px solid var(--green)}
  .wb.cancel{opacity:.45;background:#F1EEE8}
  .wb.cancel .tt{text-decoration:line-through}
  .wb.mont{background:repeating-linear-gradient(135deg,#F3EFE7 0 6px,#EAE4D8 6px 12px)}
  .wlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .wlegend span{display:inline-flex;align-items:center;gap:6px}
  .wlegend i{display:inline-block;width:18px;height:10px;border-radius:3px;background:#F6F3EC;border-left:3px solid var(--green)}
  /* FAB */
  .fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;line-height:58px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:6}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
  @media (min-width:700px){ .overlay{align-items:center} .sheet{border-radius:18px} }
  .sheet h3{font-family:Fraunces,serif;font-size:21px;margin:4px 0 12px;color:var(--green);overflow-wrap:anywhere}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-size:16px}
  textarea{min-height:70px;resize:vertical}
  details{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
  summary{font-weight:700;color:var(--green);cursor:pointer;padding:6px 0}
  .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .btn{flex:1;border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;min-width:110px}
  .btn.pri{background:var(--green);color:#fff}
  .btn.sec{background:#fff;border:1px solid var(--line)}
  .btn.warn{background:#fff;border:1px solid #E6C4C1;color:var(--red)}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}
  .kv div:nth-child(odd){color:var(--muted);font-weight:600}

<script>
const RO_ZILE = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
const RO_ZILE_SC = ['L','Ma','Mi','J','V','S','D'];
const RO_LUNI = ['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
const S = {
  data: null, view: 'acasa', month: null, selDay: null, week: null,
  hiddenSpaces: new Set(), resp: '', showCancelled: true, showPast: false, q: ''
};

/* ---------- utilitare ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => ('0' + n).slice(-2);
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseIso = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const shown = v => String(v == null ? '' : v).replace(/^'/, '');
function longDate(s) { const d = parseIso(s); return RO_ZILE[d.getDay()] + ', ' + d.getDate() + ' ' + RO_LUNI[d.getMonth()] + ' ' + d.getFullYear(); }
function shortDate(s) { const d = parseIso(s); return RO_ZILE[d.getDay()].slice(0,3) + ' ' + d.getDate() + ' ' + RO_LUNI[d.getMonth()].slice(0,3); }
function optState(e) {
  if (e.status !== 'Opțiune' || !e.optiunePana) return null;
  const t = S.data.now;
  if (e.optiunePana < t) return 'expired';
  if (e.optiunePana === t) return 'today';
  return 'ok';
}
function statusBadge(e) {
  const st = optState(e);
  if (st === 'expired') return '<span class="badge b-exp">Opțiune expirată</span>';
  if (st === 'today') return '<span class="badge b-exp">Opțiune · expiră azi</span>';
  if (st === 'ok') return '<span class="badge b-Opțiune">Opțiune până ' + esc(shortDate(e.optiunePana)) + '</span>';
  return '<span class="badge b-' + esc(e.status) + '">' + esc(e.status || '—') + '</span>';
}
function addDaysIso(iso, n) { const d = parseIso(iso); d.setDate(d.getDate() + n); return iso && iso.length ? (d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())) : ''; }
function timeRange(e) { return (e.start || '') + (e.sfarsit ? '–' + e.sfarsit : ''); }
function colorOf(sp) { const f = S.data.lists.spatii.find(x => x.name === sp); return f ? f.color : '#4A4A4A'; }
function nameOf(email) { return String(email || '').split('@')[0]; }
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms || 2600); }
function loading(on) { $('loading').classList.toggle('show', !!on); }
/* ============ CONFIGURARE ============ */
const CONFIG = {
  CLIENT_ID: "541619680642-c3rufd8rfgg8mtuikvj0218irm9rohsj.apps.googleusercontent.com",
  SERVICE_URL: "https://script.google.com/macros/s/AKfycbwXVsgTOZyMrVxDhvPR8XebNDuycoRDyLyOzTSrWxFPCmhf5JmbjzyoeHRstcYAHOE/exec"
};

/* ---------- autentificare Google (același mecanism ca la aplicația fraților) ---------- */
const AUTH_KEY = 'rcal.auth', HINT_KEY = 'rcal.hint', STATE_KEY = 'rcal.state', NONCE_KEY = 'rcal.nonce';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  del(k) { try { localStorage.removeItem(k); } catch (_) {} }
};
function jwtPayload(t) { try { const b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))))); } catch (_) { return null; } }
function savedToken() { try { const a = JSON.parse(store.get(AUTH_KEY) || 'null'); if (a && a.exp > Date.now() + 60000) return a.token; } catch (_) {} return null; }
function redirectUri() { return location.origin + location.pathname.replace(/index\.html$/, ''); }
function startLogin(silent) {
  const state = Math.random().toString(36).slice(2), nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { sessionStorage.setItem(STATE_KEY, state); sessionStorage.setItem(NONCE_KEY, nonce); } catch (_) {}
  const p = new URLSearchParams({ client_id: CONFIG.CLIENT_ID, redirect_uri: redirectUri(), response_type: 'id_token', scope: 'openid email', state, nonce });
  const hint = store.get(HINT_KEY);
  if (silent && hint) { p.set('prompt', 'none'); p.set('login_hint', hint); } else p.set('prompt', 'select_account');
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + p.toString();
}
function consumeRedirect() {
  if (!location.hash || location.hash.length < 2) return null;
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get('id_token') && !h.get('error')) return null;
  history.replaceState(null, '', location.pathname + location.search);
  let st = null, nonce = null; try { st = sessionStorage.getItem(STATE_KEY); nonce = sessionStorage.getItem(NONCE_KEY); } catch (_) {}
  if (h.get('error')) return { error: h.get('error') };
  if (st && h.get('state') !== st) return { error: 'state_mismatch' };
  const token = h.get('id_token'), pl = jwtPayload(token) || {};
  if (nonce && pl.nonce && pl.nonce !== nonce) return { error: 'nonce_mismatch' };
  store.set(AUTH_KEY, JSON.stringify({ token, exp: pl.exp ? pl.exp * 1000 : Date.now() + 3600e3 }));
  if (pl.email) store.set(HINT_KEY, pl.email);
  return { token };
}
function logout() { [AUTH_KEY, HINT_KEY].forEach(k => store.del(k)); location.reload(); }
function loginScreen(msg) {
  loading(false);
  $('loginErr').style.display = msg ? 'block' : 'none';
  $('loginErr').textContent = msg || '';
  $('login').classList.add('show');
  showGoogleButton();
}
$('loginBtn').onclick = () => startLogin(false);
/* Butonul oficial Google (Google Identity Services). Dacă scriptul Google nu se încarcă, rămâne butonul nostru, cu redirecționare. */
let gisReady = false;
function showGoogleButton() {
  if (!(window.google && google.accounts && google.accounts.id)) { $('loginBtn').style.display = ''; return; }
  if (!gisReady) {
    google.accounts.id.initialize({
      client_id: CONFIG.CLIENT_ID, auto_select: true, use_fedcm_for_prompt: true,
      login_hint: store.get(HINT_KEY) || undefined,
      callback: r => {
        const pl = jwtPayload(r.credential) || {};
        store.set(AUTH_KEY, JSON.stringify({ token: r.credential, exp: pl.exp ? pl.exp * 1000 : Date.now() + 3600e3 }));
        if (pl.email) store.set(HINT_KEY, pl.email);
        location.reload();
      }
    });
    gisReady = true;
  }
  $('gbtn').innerHTML = '';
  google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', locale: 'ro', width: 260 });
  $('loginBtn').style.display = 'none';
}
window.onGisLoad = () => { if ($('login').classList.contains('show')) showGoogleButton(); };

let TOKEN = null;
async function api(action, extra) {
  const pl = jwtPayload(TOKEN) || {};
  if (!TOKEN || (pl.exp && pl.exp * 1000 < Date.now() + 30000)) { store.del(AUTH_KEY); startLogin(true); throw new Error('expired'); }
  const r = await fetch(CONFIG.SERVICE_URL, { method: 'POST', body: JSON.stringify(Object.assign({ token: TOKEN, action }, extra || {})) });
  const j = await r.json();
  if (j && j.error === 'unauthorized') { store.del(AUTH_KEY); startLogin(true); throw new Error('expired'); }
  if (j && j.error === 'not_member') { loginScreen('Contul ' + j.email + ' nu are acces la calendar. Cere să fii adăugat în foaia „Echipa”.'); store.del(AUTH_KEY); throw new Error('not_member'); }
  if (j && j.error && !j.needsConfirm && !j.staleEdit && j.error !== 'server' && typeof j.error === 'string' && j.error.length < 40 && !/ /.test(j.error)) throw new Error(j.error);
  if (j && j.error === 'server') throw new Error(j.message || 'eroare de server');
  return j;
}
const ACTIONS = {
  getData: () => api('bootstrap'),
  saveEvent: (ev, opts) => api('save', { event: ev, opts: opts }),
  archiveEvent: (id, expectedModified) => api('archive', { id: id, expectedModified: expectedModified }),
  taskUpdate: (id, patch) => api('task', { id: id, patch: patch }),
  taskAdd: (task) => api('task_add', { task: task }),
  riderSave: (row) => api('rider_save', { row: row })
};
function call(fn, args, ok) {
  loading(true);
  ACTIONS[fn].apply(null, args || [])
    .then(r => { loading(false); ok(r); })
    .catch(err => { loading(false); if (err && (err.message === 'expired' || err.message === 'not_member')) return; toast('Eroare: ' + (err && err.message ? err.message : err) + '. Verifică semnalul și încearcă din nou.', 5000); });
}

/* ---------- încărcare ---------- */
function load(silent) {
  if (silent) {
    ACTIONS.getData().then(r => { S.data = r; document.body.classList.toggle('ro', !!(r.user && r.user.readonly)); render(); }).catch(() => {});
  } else {
    call('getData', [], r => { S.data = r; document.body.classList.toggle('ro', !!(r.user && r.user.readonly)); if (!S.month) { const t = parseIso(r.now); S.month = new Date(t.getFullYear(), t.getMonth(), 1); } render(); openPending(); });
  }
}

/* ---------- filtre ---------- */
function filtered() {
  const q = S.q.trim().toLowerCase();
  const evs = S.data.events.concat(S.data.events.filter(e => e.montajData && e.montaj && e.montajData < e.data && e.status !== 'Anulat')
    .map(e => Object.assign({}, e, { _montaj: e.data, data: e.montajData, start: e.montaj, sfarsit: '', titlu: 'Montaj: ' + shown(e.titlu) })));
  return evs.filter(e =>
    !S.hiddenSpaces.has(e.spatiu) &&
    (!S.resp || e.responsabil === S.resp) &&
    (S.showCancelled || e.status !== 'Anulat') &&
    (!q || [e.titlu, e.client, e.contact, e.adusDe, e.note, e.tip, e.spatiu, e.responsabil].join(' ').toLowerCase().includes(q))
  ).sort((a, b) => (a.data + (a.start || '')).localeCompare(b.data + (b.start || '')));
}

function renderFilters() {
  const L = S.data.lists;
  let h = L.spatii.map(s => `<button class="chip ${S.hiddenSpaces.has(s.name) ? 'off' : ''}" data-sp="${esc(s.name)}"><span class="dot" style="background:${esc(s.color)}"></span>${esc(s.name)}</button>`).join('');
  h += `<span class="chip"><select id="fResp"><option value="">Toți responsabilii</option>${L.responsabili.map(r => `<option ${S.resp === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></span>`;
  h += `<button class="chip ${S.showCancelled ? '' : 'off'}" id="fCanc">Anulate</button>`;
  $('filters').innerHTML = h;
  $('filters').querySelectorAll('[data-sp]').forEach(b => b.onclick = () => {
    const n = b.dataset.sp; S.hiddenSpaces.has(n) ? S.hiddenSpaces.delete(n) : S.hiddenSpaces.add(n); render();
  });
  $('fResp').onchange = e => { S.resp = e.target.value; render(); };
  $('fCanc').onclick = () => { S.showCancelled = !S.showCancelled; render(); };
}

/* ---------- randare ---------- */
function openPending() {
  let id = null; try { id = sessionStorage.getItem('rcal.open'); sessionStorage.removeItem('rcal.open'); } catch (_) {}
  if (!id) return;
  if (S.data.events.some(x => x.id === id)) openDetail(id); else toast('Evenimentul din link nu mai e în calendar (a fost arhivat sau șters).', 4500);
}
window.addEventListener('hashchange', () => {
  const m = /^#e=([^&]+)/.exec(location.hash || '');
  if (!m || !S.data) return;
  try { sessionStorage.setItem('rcal.open', decodeURIComponent(m[1])); } catch (_) {}
  history.replaceState(null, '', location.pathname + location.search); openPending();
});
function eventLink(id) { return location.origin + location.pathname + '#e=' + encodeURIComponent(id); }
function copyText(t, ok) {
  const done = () => toast(ok || 'Copiat');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => prompt('Copiază de aici:', t));
  else prompt('Copiază de aici:', t);
}
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === S.view));
  const noFilters = S.view === 'acasa' || S.view === 'sarcini';
  $('filters').style.display = noFilters ? 'none' : '';
  $('q').style.display = noFilters ? 'none' : '';
  if (S.data.user) $('who').textContent = S.data.user.name + (S.data.user.readonly ? ' · doar citire' : '');
  renderFilters();
  if (S.view === 'luna') renderMonth();
  else if (S.view === 'sarcini') renderTasks();
  else if (S.view === 'sapt') renderWeek();
  else if (S.view === 'acasa') renderHome();
  else renderAgenda();
}

function cardHtml(e) {
  return `<div class="card ${e.status === 'Anulat' ? 'cancel' : ''} ${e.status === 'Opțiune' && !e._montaj ? 'opt' : ''} ${isBlock(e) ? 'blk' : ''}" data-id="${esc(e.id)}">
    <div class="bar" style="background:${esc(colorOf(e.spatiu))}"></div>
    <div class="body">
      <div class="time">${esc(e._montaj ? 'de la ' + e.start : timeRange(e))} · ${esc(e.spatiu)}${e._montaj ? ' <span class="badge b-Montaj">Montaj pentru ' + esc(shortDay(e._montaj)) + '</span>' : statusBadge(e)}</div>

function progHtml(e) {
  const ts = tasksOf(e.id).filter(t => t.stare !== 'Anulată');
  if (!ts.length) return '';
  const done = ts.filter(t => t.stare === 'Gata').length, late = ts.filter(taskLate).length;

}

function groupHtml(list) {
  const today = S.data.now;
  let h = '', cur = '';
  list.forEach(e => {
    if (e.data !== cur) { cur = e.data; h += `<div class="dayhead" ${e.data === today ? 'id="todayMark"' : ''}><span>${esc(longDate(e.data))}</span>${e.data === today ? '<span class="today">Azi</span>' : ''}</div>`; }
    h += cardHtml(e);
  });
  return h;
}

function bindCards(root) { root.querySelectorAll('.card').forEach(c => c.onclick = () => openDetail(c.dataset.id)); }

function renderAgenda() {

  if (!next.length || next[0].data !== today) h += `<div class="dayhead" id="todayMark"><span>${esc(longDate(today))}</span><span class="today">Azi</span></div><div class="nothing" style="padding:4px 2px 14px">Nimic programat azi.${next.length ? ' Urmează ' + esc(longDate(next[0].data).toLowerCase()) + '.' : ''}</div>`;
  h += next.length ? groupHtml(next) : '<div class="empty">Niciun eveniment programat de azi înainte.</div>';

}

function renderMonth() {
  const m = S.month, today = S.data.now;
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const offset = (first.getDay() + 6) % 7;
  const start = new Date(first); start.setDate(1 - offset);
  const byDay = {};
  filtered().forEach(e => (byDay[e.data] = byDay[e.data] || []).push(e));
  let h = `<div class="monthnav"><button class="navbtn" id="mPrev">&#8249;</button><h2>${RO_LUNI[m.getMonth()]} ${m.getFullYear()}</h2><button class="navbtn" id="mNext">&#8250;</button></div><div class="grid">`;
  h += RO_ZILE_SC.map(z => `<div class="wd">${z}</div>`).join('');
  const maxPills = window.innerWidth >= 800 ? 4 : 3, small = window.innerWidth < 600;
  if (small && !S.selDay && today.slice(0, 7) === iso(first).slice(0, 7)) S.selDay = today;
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = iso(d), ev = byDay[k] || [];
    if (i === 35 && d.getMonth() !== m.getMonth()) break;
    h += `<div class="cell ${d.getMonth() !== m.getMonth() ? 'out' : ''} ${k === today ? 'today' : ''} ${k === S.selDay ? 'sel' : ''}" data-day="${k}"><div class="n">${d.getDate()}</div>`;
    if (small) {
      if (ev.length) h += '<div class="dots">' + ev.slice(0, 6).map(e => {
        const c = esc(colorOf(e.spatiu));
        const cls = e.status === 'Anulat' ? 'cancel' : (e.status === 'Opțiune' ? 'opt' : '');
        return `<i class="${cls}" style="background:${c};border-color:${c}"></i>`;
      }).join('') + '</div>';
      h += '</div>'; continue;
    }
    ev.slice(0, maxPills).forEach(e => {
      const c = esc(colorOf(e.spatiu));
      const cls = e.status === 'Anulat' ? 'cancel' : (e.status === 'Opțiune' ? 'opt' + (optState(e) === 'expired' ? ' expired' : '') : '');
      h += `<div class="pill ${cls}" data-id="${esc(e.id)}" title="${esc(timeRange(e) + ' · ' + shown(e.titlu))}" style="background:${c};border-color:${c}">${maxPills > 3 ? esc(e.start) + ' ' : ''}${esc(shown(e.titlu))}</div>`;
    });
    if (ev.length > maxPills) h += `<div class="more">+${ev.length - maxPills}</div>`;
    h += `</div>`;
  }
  h += `</div><div class="legend"><span><i class="c"></i>Confirmat</span><span><i class="o"></i>Opțiune: dată propusă, neconfirmată</span><span>Culoarea arată sala: ${S.data.lists.spatii.map(x => `<b style="color:${esc(x.color)}">${esc(x.name)}</b>`).join(', ')}</span></div><div class="daypanel" id="dayPanel"></div>`;
  $('view').innerHTML = h;
  $('mPrev').onclick = () => { S.month = new Date(m.getFullYear(), m.getMonth() - 1, 1); S.selDay = null; renderMonth(); };
  $('mNext').onclick = () => { S.month = new Date(m.getFullYear(), m.getMonth() + 1, 1); S.selDay = null; renderMonth(); };
  $('view').querySelectorAll('.pill[data-id]').forEach(p => p.onclick = ev => { ev.stopPropagation(); openDetail(p.dataset.id); });
  $('view').querySelectorAll('.cell').forEach(c => c.onclick = () => { S.selDay = c.dataset.day; renderMonth(); $('dayPanel').scrollIntoView({behavior: 'smooth', block: 'start'}); });
  if (S.selDay) {
    const ev = byDay[S.selDay] || [];
    $('dayPanel').innerHTML = `<div class="dayhead"><span>${esc(longDate(S.selDay))}</span></div>` +
      (ev.length ? ev.map(cardHtml).join('') : '<div class="empty">Nimic programat.</div>') +
      `<button class="linkbtn" id="addDay">+ Adaugă eveniment în această zi</button>`;
    $('addDay').onclick = () => openForm(null, { data: S.selDay });
    bindCards($('dayPanel'));
  }
}

/* ---------- Acasă ---------- */
function lei0(n) { return (Math.round(Number(n) || 0)).toLocaleString('ro-RO') + ' lei'; }
function evRoles(e, name) {
  return [e.responsabil === name && 'responsabil', e.deschide === name && 'montaj', e.inchide === name && 'demontaj'].filter(Boolean);
}
function rowEvHtml(e, name, withDay) {
  const r = name ? evRoles(e, name) : [];
  const bits = [e.spatiu, isBlock(e) && 'blocaj intern'];
  if (e._montaj) bits.push('montaj pentru ' + shortDay(e._montaj));
  else {
    if (e.status !== 'Confirmat') bits.push(e.status === 'Opțiune' ? 'opțiune' : e.status.toLowerCase());
    if (e.montaj) bits.push('montaj ' + (e.montajData ? shortDay(e.montajData) + ' ' : '') + e.montaj);
    if (e.acces) bits.push('acces ' + e.acces);
  }
  if (r.length) bits.push('tu: ' + r.join(', '));
  return `<div class="rowev ${e.status === 'Anulat' ? 'cancel' : ''}" data-id="${esc(e.id)}"><span class="t">${withDay ? '<small>' + esc(shortDay(e.data).split(' ').slice(0, 2).join(' ')) + '</small>' : ''}${esc(e.start || '—')}</span><span class="b" style="background:${esc(colorOf(e.spatiu))}"></span><div class="x"><b>${esc(shown(e.titlu))}</b><span>${esc(bits.filter(Boolean).join(' · '))}</span></div></div>`;
}
function allWithMontaj() {
  return S.data.events.concat(S.data.events.filter(e => e.montajData && e.montaj && e.montajData < e.data && e.status !== 'Anulat')
    .map(e => Object.assign({}, e, { _montaj: e.data, data: e.montajData, start: e.montaj, sfarsit: '', titlu: 'Montaj: ' + shown(e.titlu) })));
}
function occMinutes(e) {
  const st = minOf(e.start); if (st === null) return 120;
  const md = e.montajData && e.montaj && e.montajData < e.data ? (dayN(e.data) - dayN(e.montajData)) * 1440 : 0;
  const s = (minOf(e.montaj) !== null ? minOf(e.montaj) : st) - md;
  let f = minOf(e.demontaj); if (f === null) f = minOf(e.sfarsit); if (f === null) f = st + 120; if (f <= st) f += 1440;
  return Math.max(30, f - s);
}
function renderHome() {
  const D = S.data, today = D.now, tom = addDaysIso(today, 1), me = D.user ? D.user.name : '', ro = D.user && D.user.readonly;
  const live = D.events.filter(e => e.status !== 'Anulat' && !isBlock(e));
  const all = allWithMontaj().filter(e => e.status !== 'Anulat').sort((a, b) => (a.data + (a.start || '')).localeCompare(b.data + (b.start || '')));
  const ym = today.slice(0, 7), lunaN = RO_LUNI[Number(ym.slice(5)) - 1];
  const inMonth = live.filter(e => e.data.slice(0, 7) === ym);
  const conf = inMonth.filter(e => e.status === 'Confirmat').length, optN = inMonth.filter(e => e.status === 'Opțiune').length;
  const valLuna = inMonth.reduce((a, e) => a + (Number(e.valoare) || 0), 0);
  const viit = live.filter(e => e.data >= today && Number(e.valoare) > 0);
  const deIncasat = viit.reduce((a, e) => a + Math.max(0, (Number(e.valoare) || 0) - (Number(e.avans) || 0)), 0);
  const liveIds = new Set(live.map(e => e.id));
  const openT = (D.tasks || []).filter(t => t.stare === 'De făcut' && liveIds.has(t.eventId));
  const lateAll = openT.filter(t => t.termen && t.termen < today);
  const mine = openT.filter(t => t.responsabil === me);
  const lateMine = mine.filter(t => t.termen && t.termen < today);
  const opts = live.filter(e => e.status === 'Opțiune').sort((a, b) => (a.optiunePana || '').localeCompare(b.optiunePana || ''));
  const h0 = new Date().getHours();
  const hi = h0 < 12 ? 'Bună dimineața' : h0 < 18 ? 'Bună ziua' : 'Bună seara';

  let h = `<div class="hello"><h2>${hi}${me ? ', ' + esc(me) : ''}</h2><span class="hint">${esc(longDate(today))} &nbsp; <button class="navbtn" id="hBrief" style="padding:0 12px">Brief-ul zilei</button> <button class="navbtn" id="hProg" style="padding:0 12px">Program public</button></span></div>`;
  h += `<div class="kpis">
    <div class="kpi" data-go="luna"><div class="k">Evenimente în ${lunaN}</div><div class="v">${conf + optN}</div><div class="s">${conf} confirmate · ${optN} opțiuni</div></div>
    <div class="kpi" data-go="luna"><div class="k">Valoare contractată în ${lunaN}</div><div class="v">${lei0(valLuna)}</div><div class="s">din câmpul Valoare</div></div>
    <div class="kpi" data-go="agenda"><div class="k">De încasat, de azi înainte</div><div class="v">${lei0(deIncasat)}</div><div class="s">valoare minus avans · ${viit.length} evenimente</div></div>
    <div class="kpi ${(ro ? lateAll : lateMine).length ? 'bad' : ''}" data-go="sarcini"><div class="k">${ro ? 'Sarcini întârziate (echipa)' : 'Sarcinile tale întârziate'}</div><div class="v">${(ro ? lateAll : lateMine).length}</div><div class="s">${ro ? openT.length + ' deschise în total' : mine.length + ' deschise ale tale'}</div></div>
    <div class="kpi ${opts.some(e => optState(e) === 'expired') ? 'bad' : ''}" data-go="agenda"><div class="k">Opțiuni deschise</div><div class="v">${opts.length}</div><div class="s">${opts.filter(e => optState(e) === 'expired').length} expirate</div></div>
  </div>`;

  // Azi și mâine
  const day = d => all.filter(e => e.data === d);
  const dayList = (d, lbl) => `<h5>${lbl} · ${esc(shortDay(d))}</h5>` + (day(d).length ? day(d).map(e => rowEvHtml(e, me)).join('') : '<div class="nothing">Nimic programat.</div>');
  h += `<div class="hgrid"><section class="panel"><h4>Azi și mâine <a data-go="sapt">Săptămâna →</a></h4>${dayList(today, 'Azi')}${dayList(tom, 'Mâine')}`;
  const next7 = all.filter(e => e.data > tom && e.data <= addDaysIso(today, 7));
  h += `<h5>Până ${esc(shortDay(addDaysIso(today, 7)))}</h5>` + (next7.length ? next7.map(e => rowEvHtml(e, me, true)).join('') : '<div class="nothing">Nimic programat.</div>') + `</section>`;

  // Sarcini
  if (!ro) {
    const show = mine.filter(t => !t.termen || t.termen <= addDaysIso(today, 3)).sort((a, b) => (a.termen || '9').localeCompare(b.termen || '9'));
    h += `<section class="panel"><h4>Sarcinile tale <a data-go="sarcini">Toate →</a></h4>` +

  }

  soon.filter(e => e.data <= addDaysIso(today, 7)).forEach(e => { const r = readiness(e); if (r.total && r.gata < r.total) { const st = readyState(e, r); if (st === 'bad') issues.push([e, (r.late ? 'Sarcină critică întârziată' : 'Nepregătit, e mâine') + ' (' + r.gata + '/' + r.total + '): ' + r.list.filter(t => t.stare !== 'Gata').map(t => shown(t.sarcina)).slice(0, 2).join('; '), 'var(--red)']); } });
  soon.filter(e => !e.sfarsit).forEach(e => issues.push([e, 'Fără oră de final', 'var(--amber)']));

    (rowsA.length ? `<table class="adus"><tr><th>Adus de</th><th>Contracte</th><th>Confirmate</th><th>Valoare confirmată</th><th>Comision</th></tr>` + rowsA.map(([n, l]) => {

    const ev = live.filter(e => e.data >= today && e.data <= end30 && (e.spatiu === sp.name || e.spatiu === 'Toată locația'));

/* ---------- Săptămână ---------- */

function openBrief(day) {

    .sort((a, b) => (a.data + (a.start || '')).localeCompare(b.data + (b.start || '')));
  const mom = [];

    const today = e.data === day, col = colorOf(e.spatiu), t = shown(e.titlu);
    if (e.montaj && (e.montajData ? e.montajData === day : today)) mom.push([e.montaj, e, 'Montaj începe' + (e.echipOrg ? ' · ' + echipVal(e.echipOrg).toLowerCase() : '') + (inchiriaza(e.echipOrg) && shown(e.tehnic) ? ' (' + shown(e.tehnic) + ')' : '') + (areTehnician(e.sprijinTehnic) ? ' · cu tehnician de la noi' : ''), 'deschide: ' + (e.deschide || DE_TURA)]);

    if (e.acces) mom.push([e.acces, e, 'Acces public', e.responsabil ? 'resp.: ' + e.responsabil : '']);
    mom.push([e.start, e, isBlock(e) ? 'Blocaj / mentenanță' : 'Început' + (e.participanti ? ' · ' + e.participanti + ' persoane estimate' : ''), e.responsabil ? 'resp.: ' + e.responsabil : '']);
    if (e.sfarsit) mom.push([e.sfarsit, e, 'Final', '']);
    if (e.demontaj) mom.push([e.demontaj, e, 'Demontaj gata', 'închide: ' + (e.inchide || DE_TURA)]);
  });
  const key = t => { const m = minOf(t); return m === null ? 9999 : m; };
  mom.sort((a, b) => key(a[0]) - key(b[0]));
  const ppl = {};
  const add = (n, x) => { if (n) (ppl[n] = ppl[n] || []).push(x); };
  evs.forEach(e => {
    const t = shown(e.titlu);
    if (e.data === day) add(e.responsabil, 'responsabil ' + t);

  const liveIds = new Set(evs.map(e => e.id));
  (S.data.tasks || []).filter(t => t.stare === 'De făcut' && t.termen === day && liveIds.has(t.eventId) && t.modul !== 'montaj').forEach(t => add(t.responsabil || 'fără responsabil', shown(t.sarcina)));
  const nepreg = evs.filter(e => e.data === day).map(e => [e, readiness(e)]).filter(([e, r]) => r.total && r.gata < r.total);
  let h = `<div class="brief"><h3>Brief operațional</h3><div class="hint" style="font-size:14px">${esc(longDate(day))} · Republica | 1963</div>
    <div class="bnav noprint"><button class="navbtn" id="bPrev">&#8249; ziua dinainte</button><button class="navbtn" id="bNext">ziua următoare &#8250;</button><button class="navbtn" id="bPrint" style="padding:0 12px">Tipărește</button><button class="navbtn" id="bClose" style="padding:0 12px">Închide</button></div>`;

/* Pe calculator, câmpul de oră nativ din Chrome (două coloane de derulat) e greu de folosit.
   Îl înlocuim cu un câmp în care scrii ora (19, 1930, 19.30, 7:5) și o listă cu orele din jumătate în jumătate de oră. */
const FINE_POINTER = window.matchMedia && matchMedia('(pointer:fine)').matches;
function normTime(v) {
  v = String(v || '').trim().replace(/[.,h ]/g, ':');
  if (!v) return '';
  let m = /^(\d{1,2})$/.exec(v) || /^(\d{1,2}):(\d{1,2})$/.exec(v) || /^(\d{2})(\d{2})$/.exec(v) || /^(\d)(\d{2})$/.exec(v);
  if (!m) return null;
  const h = +m[1], mi = +(m[2] || 0);
  if (h > 23 || mi > 59) return null;
  return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
}
function enhanceTimes(root) {
  if (!FINE_POINTER) return;
  if (!$('timeList')) {
    const dl = document.createElement('datalist'); dl.id = 'timeList';
    for (let i = 0; i < 48; i++) { const o = document.createElement('option'); o.value = String(Math.floor(i / 2)).padStart(2, '0') + ':' + (i % 2 ? '30' : '00'); dl.appendChild(o); }
    document.body.appendChild(dl);
  }
  root.querySelectorAll('input[type="time"]').forEach(el => {
    const v = el.value; el.type = 'text'; el.value = v;
    el.setAttribute('list', 'timeList'); el.setAttribute('placeholder', 'ex. 19:30'); el.setAttribute('maxlength', '5'); el.setAttribute('autocomplete', 'off');
    el.classList.add('tm-in');
    el.addEventListener('blur', () => {
      const n = normTime(el.value);
      if (n === null) { el.classList.add('bad'); toast('Ora „' + el.value + '” nu e bună. Scrie de forma 19:30.', 3500); return; }
      el.classList.remove('bad');
      if (n !== el.value) { el.value = n; el.dispatchEvent(new Event('input', { bubbles: true })); }
    });
  });
}

const ECHIP_OPTS = ['Vin cu tot echipamentul lor', 'Parțial: închiriază o parte de la noi', 'Nu: închiriază tot de la noi'];

function minOf(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }

  let f = minOf(b); if (f <= minOf(v.start)) f += 1440;
  const tot = durMin(f - s), pub = durTxt(v.start, v.sfarsit);
  return tot ? `Sala ocupată ${md ? shortDay(md) + ' ' + a + ' – ' + shortDay(v.data) + ' ' + b : a + '–' + b}: ${tot}${pub ? ' (cu public ' + pub + ')' : ''}. Se facturează tot intervalul.` : '';
}
function montajHtml(e) {
  if (!MONTAJ_KEYS.some(k => e[k] !== '' && e[k] != null)) return '';
  const dm = e.montajData && e.montaj ? '' : durTxt(e.montaj, e.start), dd = durTxt(e.sfarsit, e.demontaj);
  const r = [];
  if (e.montaj) r.push(['Montaj', `${e.montajData ? 'din ' + esc(shortDay(e.montajData)) + ', ' : ''}de la ${esc(e.montaj)}${dm ? ` <span class="hint">(${dm} înainte de început)</span>` : ''}`]);
  if (e.proba) r.push(['Probă de sunet', esc(e.proba)]);
  if (e.acces) r.push(['Acces public', 'de la ' + esc(e.acces)]);
  if (e.demontaj) r.push(['Demontaj', `până la ${esc(e.demontaj)}${dd ? ` <span class="hint">(${dd} după final)</span>` : ''}`]);
  const occ = occTxt(e); if (occ) r.unshift(['Sala ocupată', `<b>${occ.replace(/^Sala ocupată /, '')}</b>`]);
  r.push(['Montaj, de la noi', e.deschide ? esc(e.deschide) + ' <span class="hint">deschide, predă echipamentele, supraveghează</span>' : esc(DE_TURA) + ' <span class="hint">cine e pe grafic în ziua aceea</span>']);
  r.push(['Demontaj, de la noi', e.inchide ? esc(e.inchide) + ' <span class="hint">supraveghează, preia echipamentele, închide</span>' : esc(DE_TURA) + ' <span class="hint">cine e pe grafic în ziua aceea</span>']);
  if (e.echipOrg) r.push(['Echipament', esc(echipVal(e.echipOrg))]);
  if (inchiriaza(e.echipOrg) && shown(e.tehnic)) r.push(['De închiriat de la noi', esc(shown(e.tehnic))]);
  if (e.sprijinTehnic) r.push(['Sprijin tehnic', esc(e.sprijinTehnic)]);
  if (e.configurare) r.push(['Sala', esc(e.configurare)]);
  if (e.contactTehnic) r.push(['Tehnic organizator', esc(shown(e.contactTehnic))]);
  return `<div class="sec"><h4>Montaj și demontaj</h4><div class="kv">${r.map(([a, b]) => `<div>${a}</div><div>${b}</div>`).join('')}</div></div>`;
}
const MONEY = ['valoare','avans','pachetBar','consumBar'];
const lei = n => (Number(n) || 0).toLocaleString('ro-RO') + ' lei';
function isBlock(e) { return /^Blocaj/i.test(e.tip || ''); }
function readiness(e) {
  const crit = new Set((S.data.templates || []).filter(t => t.critica).map(t => t.cod));
  const ts = tasksOf(e.id).filter(t => crit.has(t.sablon) && t.stare !== 'Anulată');
  const late = ts.filter(t => t.stare !== 'Gata' && t.termen && t.termen < S.data.now).length;
  return { total: ts.length, gata: ts.filter(t => t.stare === 'Gata').length, late: late, list: ts };
}
/* ok = pregătit operațional; part = în pregătire, nimic întârziat; bad = o sarcină critică a trecut de termen sau evenimentul e mâine */
function readyState(e, r) {
  r = r || readiness(e);
  if (!r.total) return '';
  if (r.gata === r.total) return 'ok';
  return r.late || e.data <= addDaysIso(S.data.now, 1) ? 'bad' : 'part';
}
function readyBadge(e) {
  if (e._montaj || e.status === 'Anulat' || isBlock(e)) return '';
  const r = readiness(e); if (!r.total) return '';
  const cls = readyState(e, r);
  const txt = cls === 'ok' ? 'Pregătit' : cls === 'bad' && r.late ? 'Întârziat ' + r.gata + '/' + r.total : 'În pregătire ' + r.gata + '/' + r.total;
  return `<span class="ready ${cls}" title="Verificări critice: ${r.gata} din ${r.total} gata${r.late ? ', ' + r.late + ' trecute de termen' : ''}">${txt}</span>`;
}
function modsOf(e) { return String(e.module || '').split(',').map(x => x.trim()).filter(Boolean); }
function modName(c) { const m = (S.data.modules || []).find(x => x.cod === c); return m ? m.nume : c; }
function tasksOf(id) { return (S.data.tasks || []).filter(t => t.eventId === id); }
function riderOf(id) { return (S.data.rider || []).filter(r => r.eventId === id); }
function taskLate(t) { return t.stare === 'De făcut' && t.termen && t.termen < S.data.now; }
function mergeById(arr, items) { (items || []).forEach(it => { const i = arr.findIndex(x => x.id === it.id); if (i >= 0) arr[i] = it; else arr.push(it); }); }

function openDetail(id) {
  const e = S.data.events.find(x => x.id === id);
  if (!e) return;
  const rows = FIELDS.filter(([k]) => !MONTAJ_KEYS.includes(k) && !PUBLIC_KEYS.includes(k) && !(k === 'tehnic' && inchiriaza(e.echipOrg)) && e[k] !== '' && e[k] != null).map(([k, l]) => {
    let v = (k === 'data' || k === 'optiunePana') ? longDate(e[k]) : shown(e[k]);
    if (MONEY.includes(k)) v = lei(e[k]);
    return `<div>${esc(l)}</div><div>${esc(v)}</div>`;
  }).join('');
  openSheet(`<h3>${esc(shown(e.titlu))}</h3><div class="kv">${rows}</div>
    ${dossierHtml(e)}
    <div class="stamp">Adăugat de ${esc(nameOf(e.creatDe))} la ${esc(e.creatLa)}${e.modificatLa && e.modificatLa !== e.creatLa ? '<br>Modificat de ' + esc(nameOf(e.modificatDe)) + ' la ' + esc(e.modificatLa) : ''}<br>ID ${esc(e.id)}</div>
    <div class="actions">
      <button class="btn pri" id="dEdit">Editează</button>
      <button class="btn sec" id="dDup">Duplică</button>
      <button class="btn sec" id="dLink">Copiază linkul</button>
      <button class="btn warn" id="dArch">Arhivează</button>
      <button class="btn sec" id="dClose">Închide</button>
    </div>`);
  $('dEdit').onclick = () => openForm(e);
  $('dLink').onclick = () => copyText(eventLink(e.id), 'Linkul fișei e copiat. Îl poți trimite pe WhatsApp sau email.');
  $('dDup').onclick = () => { const c = Object.assign({}, e); delete c.id; c.status = 'Opțiune'; c.optiunePana = ''; ['spectatoriReali','consumBar','feedback','bilVandute','aprobatPublicare'].forEach(k => c[k] = ''); openForm(null, c); };
  $('dArch').onclick = () => {
    if (!confirm('Arhivezi „' + shown(e.titlu) + '”? Dispare din calendar, dar rămâne în Sheet.')) return;
    call('archiveEvent', [e.id, e.modificatLa], r => {
      if (r.staleEdit) { replaceEvent(r.current); toast('Între timp evenimentul a fost modificat. Verifică și încearcă din nou.', 4500); openDetail(id); return; }
      if (r.error) return toast(r.error, 4500);
      mergeById(S.data.tasks, r.tasks);
      S.data.events = S.data.events.filter(x => x.id !== id); closeSheet(); render(); toast('Arhivat');
    });
  };
  $('dClose').onclick = closeSheet;
  bindDossier(e);
}

/* ---------- dosarul evenimentului: module, sarcini, rider, rezultat ---------- */
function dossierHtml(e) {
  const mods = modsOf(e);
  const tasks = tasksOf(e.id).filter(t => t.stare !== 'Anulată').sort((a, b) => (a.termen || '9').localeCompare(b.termen || '9'));
  const done = tasks.filter(t => t.stare === 'Gata').length;
  const rider = riderOf(e.id);
  let h = '';
  h += montajHtml(e);
  h += publicHtml(e);
  const rd = readiness(e);
  if (rd.total && !isBlock(e)) h += `<div class="sec"><h4>Pregătire operațională <small>${rd.gata} din ${rd.total} verificări critice${rd.late ? ' · ' + rd.late + ' întârziate' : ''}</small></h4>` +
    rd.list.map(t => { const late = t.stare !== 'Gata' && t.termen && t.termen < S.data.now; return `<div class="chk ${t.stare === 'Gata' ? 'ok' : late ? 'no' : 'wait'}"><i>${t.stare === 'Gata' ? '✓' : late ? '!' : '·'}</i><span>${esc(shown(t.sarcina))}${t.stare !== 'Gata' ? ' · ' + esc(t.responsabil || 'fără responsabil') + (t.termen ? ' · ' + (late ? 'întârziată, termen ' : 'termen ') + esc(shortDay(t.termen)) : '') : ''}</span></div>`; }).join('') +
    (rd.gata < rd.total ? '<div class="hint">Evenimentul nu e gata pentru accesul publicului până nu sunt bifate toate.</div>' : '') + `</div>`;
  h += `<div class="sec"><h4>Necesar logistic <small><a href="#" id="modsEdit">modifică</a></small></h4><div class="mods" id="modsView" style="cursor:pointer">${mods.map(c => `<span class="mod on">${esc(modName(c))}</span>`).join('') || '<span class="mod">Nimic bifat. Apasă ca să alegi.</span>'}</div></div>`;
  h += `<div class="sec"><h4>Sarcini <small>${done} din ${tasks.length} gata</small></h4>`;
  h += tasks.map(t => taskHtml(t, false)).join('') || '<div class="hint">Nicio sarcină încă. Bifează necesarul logistic (Editează) sau adaugă una de mână.</div>';
  h += `<div id="taskAddBox"></div><button class="mini" id="taskAddBtn">+ Sarcină</button></div>`;
  if (mods.includes('tehnic') || rider.length) {
    const act = rider.filter(r => r.stare !== 'Anulat');
    const cost = act.reduce((a, r) => a + (Number(r.cost) || 0), 0), pret = act.reduce((a, r) => a + (Number(r.pret) || 0), 0);
    h += `<div class="sec"><h4>Rider tehnic <small>${act.length === 1 ? "1 echipament" : act.length + " echipamente"}</small></h4>`;
    h += rider.map(r => `<div class="rid ${r.stare === 'Anulat' ? 'cancel' : ''}" data-rid="${esc(r.id)}"><div class="top"><b>${esc(shown(r.echipament))}${r.cantitate ? ' × ' + esc(r.cantitate) : ''}</b><span class="badge b-Confirmat">${esc(r.stare)}</span></div>
      <div class="sub">${esc(r.sursa)}${r.partener ? ' · ' + esc(shown(r.partener)) : ''} · cost ${lei(r.cost)} · preț ${lei(r.pret)} · marjă ${lei((Number(r.pret) || 0) - (Number(r.cost) || 0))}</div></div>`).join('');
    h += `<div id="riderBox"></div><button class="mini" id="riderAddBtn">+ Echipament</button>`;
    if (act.length) h += `<div class="tot" style="margin-top:8px"><div>Cost la noi</div><div>${lei(cost)}</div><div>Preț Organizator</div><div>${lei(pret)}</div><div class="sum">Marjă rider</div><div class="sum ${pret - cost < 0 ? 'neg' : ''}">${lei(pret - cost)}</div></div>`;
    h += `</div>`;
  }
  h += resultHtml(e);
  return h;
}

function publicHtml(e) {
  if (isBlock(e) || e.status === 'Anulat') return '';
  const v = vizOf(e);
  if (v === 'Privat') return `<div class="sec"><h4>Program public</h4><div class="hint">Privat. Nu apare pe site, în ziar-meniu sau pe ecrane.</div></div>`;
  const lips = [!shown(e.descrierePublic) && 'descrierea', !shown(e.afis) && 'afișul', modsOf(e).includes('bilete') && !shown(e.bilLink) && 'linkul de bilete'].filter(Boolean);
  const st = e.aprobatPublicare === 'DA' ? '<span class="ready ok">Aprobat pentru publicare</span>' : '<span class="ready part">De aprobat</span>';
  return `<div class="sec"><h4>Program public ${st}</h4><div class="kv">
    <div>Titlu public</div><div>${esc(pubTitle(e))}</div>
    ${shown(e.descrierePublic) ? `<div>Descriere</div><div>${esc(shown(e.descrierePublic))}</div>` : ''}
    ${shown(e.afis) ? `<div>Afiș</div><div><a href="${esc(shown(e.afis))}" target="_blank" rel="noopener">deschide</a></div>` : ''}
    ${shown(e.bilLink) ? `<div>Bilete</div><div><a href="${esc(shown(e.bilLink))}" target="_blank" rel="noopener">link</a></div>` : ''}
  </div>${lips.length ? `<div class="hint">Mai lipsește ${lips.join(', ')}.</div>` : ''}</div>`;
}

function resultHtml(e) {
  const act = riderOf(e.id).filter(r => r.stare !== 'Anulat');
  const cost = act.reduce((a, r) => a + (Number(r.cost) || 0), 0), pret = act.reduce((a, r) => a + (Number(r.pret) || 0), 0);
  const valoare = Number(e.valoare) || 0;
  const peste = e.consumBar !== '' && e.consumBar != null ? Math.max(0, (Number(e.consumBar) || 0) - (Number(e.pachetBar) || 0)) : 0;
  if (!valoare && !pret && !cost && !peste) return '';
  const total = valoare + pret + peste - cost;
  return `<div class="sec"><h4>Rezultat <small>estimat din ce e trecut</small></h4><div class="tot">
    <div>Valoare contract</div><div>${lei(valoare)}</div>
    ${pret ? `<div>Servicii tehnice refacturate</div><div>${lei(pret)}</div>` : ''}
    ${peste ? `<div>Bar peste pachet</div><div>${lei(peste)}</div>` : ''}
    ${cost ? `<div>Cost echipamente</div><div class="neg">− ${lei(cost)}</div>` : ''}
    <div class="sum">Rezultat</div><div class="sum ${total < 0 ? 'neg' : ''}">${lei(total)}</div>
  </div><div class="hint">Fără personal, consumabile și utilități. Avans încasat: ${lei(e.avans)}.</div></div>`;
}

function taskHtml(t, withEvent) {
  const ev = withEvent ? S.data.events.find(x => x.id === t.eventId) : null;
  const cls = t.stare === 'Gata' ? 'done' : (t.stare === 'Anulată' ? 'cancel' : (taskLate(t) ? 'late' : ''));
  const when = t.termen ? (t.termen === S.data.now ? 'azi' : shortDate(t.termen)) : 'fără termen';
  return `<div class="task ${cls}"><input type="checkbox" data-task="${esc(t.id)}" ${t.stare === 'Gata' ? 'checked' : ''} ${t.stare === 'Anulată' ? 'disabled' : ''}>
    <div class="tt"><b>${esc(shown(t.sarcina))}</b>
    <div class="tm">${esc(t.responsabil || 'fără responsabil')} · termen <span class="d">${esc(when)}</span>${ev ? ` · <a href="#" data-open="${esc(ev.id)}">${esc(shown(ev.titlu))}, ${esc(shortDate(ev.data))}</a>` : ''}</div></div></div>`;
}

function bindTaskChecks(root, after) {
  root.querySelectorAll('[data-task]').forEach(cb => cb.onchange = () => {
    const id = cb.dataset.task, gata = cb.checked;
    call('taskUpdate', [id, { stare: gata ? 'Gata' : 'De făcut' }], r => {
      if (r.error) return toast(r.error, 4000);
      mergeById(S.data.tasks, [r.task]);
      if (r.event) { replaceEvent(r.event); toast('Gata. Opțiunea e prelungită până ' + shortDay(r.event.optiunePana), 4000); }
      else toast(gata ? 'Gata' : 'Redeschisă');
      after();
    });
  });
  root.querySelectorAll('[data-open]').forEach(a => a.onclick = ev => { ev.preventDefault(); openDetail(a.dataset.open); });
}

  rb.onclick = () => form(null);

/* ---------- tab Sarcini ---------- */
function renderTasks() {
  const me = S.data.user && S.data.user.name;
  const live = new Set(S.data.events.map(e => e.id));
  let list = (S.data.tasks || []).filter(t => t.stare === 'De făcut' && live.has(t.eventId));
  if (S.taskScope !== 'toti') list = list.filter(t => t.responsabil === me);
  else if (S.resp) list = list.filter(t => t.responsabil === S.resp);
  list.sort((a, b) => (a.termen || '9').localeCompare(b.termen || '9'));
  const t = S.data.now, week = addDaysIso(t, 7);
  const groups = [['Întârziate', x => x.termen && x.termen < t], ['Azi', x => x.termen === t],
    ['În următoarele 7 zile', x => x.termen > t && x.termen <= week], ['Mai târziu', x => !x.termen || x.termen > week]];
  let h = `<div class="mods" style="margin-bottom:12px"><span class="mod ${S.taskScope !== 'toti' ? 'on' : ''}" data-scope="eu">Ale mele (${esc(me || '')})</span><span class="mod ${S.taskScope === 'toti' ? 'on' : ''}" data-scope="toti">Toată echipa</span></div>`;
  groups.forEach(([name, fn]) => {
    const g = list.filter(fn);
    if (g.length) h += `<div class="dayhead"><span>${name}</span><span class="hint">${g.length}</span></div>` + g.map(x => taskHtml(x, true)).join('');
  });
  if (!list.length) h += '<div class="empty">Nicio sarcină deschisă.</div>';
  $('view').innerHTML = '<div class="narrow">' + h + '</div>';
  $('view').querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { S.taskScope = b.dataset.scope; renderTasks(); });
  bindTaskChecks($('view'), renderTasks);
}

function opts(list, val, empty) {
  return (empty ? `<option value="">${esc(empty)}</option>` : '') +
    list.map(x => `<option ${x === val ? 'selected' : ''}>${esc(x)}</option>`).join('') +
    (val && !list.includes(val) ? `<option selected>${esc(val)}</option>` : '');
}

        <div><label>Vin la montaj de la</label><input id="f_montaj" type="time" value="${f('montaj')}"></div>

function bindMods(isNew, v) {
  const L = S.data.lists, box = $('modsBox');
  if (!box) return;
  let touched = !isNew || modsOf(v).length > 0, concManual = false;
  const cb = c => box.querySelector('input[value="' + c + '"]');
  const paint = () => {
    box.querySelectorAll('.mod').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
    const on = c => cb(c) && cb(c).checked;
    $('barBox').style.display = on('bar') ? '' : 'none';
    $('bilBox').style.display = on('bilete') ? '' : 'none';
  };
  const conc = () => {
    if (concManual || !cb('concession')) return;
    const n = Number(String($('f_participanti').value).replace(/\s/g, '')) || 0;
    if ($('f_spatiu').value === L.spatiuConcession && n >= Number(L.pragConcession)) { cb('concession').checked = true; paint(); }
  };
  box.querySelectorAll('input').forEach(i => i.onchange = () => { touched = true; if (i.value === 'concession') concManual = true; paint(); });
  $('f_tip').onchange = () => {
    if (touched) return;
    const tip = $('f_tip').value;
    (S.data.modules || []).forEach(m => { if (cb(m.cod)) cb(m.cod).checked = m.tipuri.includes(tip); });
    paint(); conc();
  };
  $('f_participanti').oninput = conc;
  const dur = () => {
    const md = $('f_montajData').value && $('f_montajData').value < $('f_data').value;
    const a = md ? '' : durTxt($('f_montaj').value, $('f_start').value), b = durTxt($('f_sfarsit').value, $('f_demontaj').value);
    const occ = occTxt({ montaj: $('f_montaj').value, demontaj: $('f_demontaj').value, start: $('f_start').value, sfarsit: $('f_sfarsit').value, data: $('f_data').value, montajData: $('f_montajData').value });
    $('durHint').textContent = [a && 'Montaj: ' + a + ' înainte de început', b && 'Demontaj: ' + b + ' după final', occ].filter(Boolean).join(' · ');
    if ($('occHint2')) $('occHint2').textContent = occ;
    if (($('f_montaj').value || $('f_demontaj').value) && cb('montaj') && !cb('montaj').checked) { cb('montaj').checked = true; paint(); }
  };
  ['f_montaj','f_demontaj','f_start','f_sfarsit','f_montajData','f_data'].forEach(id => $(id).addEventListener('input', dur));
  dur();

}
function bindOptBox() {

  };

  $('f_data').addEventListener('input', () => { if (auto) sync(); });

function readForm(e) {
  const o = e ? { id: e.id } : {};
  FIELDS.forEach(([k]) => { const el = $('f_' + k); if (el) o[k] = el.value; });
  ['start','sfarsit','montaj','demontaj','proba','acces'].forEach(k => { if (o[k] !== undefined) { const n = normTime(o[k]); o[k] = n === null ? o[k] : n; } });
  o.titlu = $('f_titlu').value;
  if ($('modsBox')) o.module = Array.from($('modsBox').querySelectorAll('input:checked')).map(i => i.value).join(',');
  if (o.status !== 'Opțiune') o.optiunePana = '';
  if (o.vizibil === 'Privat') o.aprobatPublicare = '';
  if (!o.montaj) o.deschide = '';
  if (!o.demontaj) o.inchide = '';
  return o;
}

function submit(e, force) {
  const input = readForm(e);
  if (!input.titlu.trim()) return toast('Lipsește titlul.');
  if (!input.data) return toast('Alege data.');
  if (!input.spatiu) return toast('Alege spațiul.');
  if (!input.start) return toast('Lipsește ora de început.');
  const badT = ['start','sfarsit','montaj','demontaj','proba','acces'].find(k => input[k] && !/^\d{2}:\d{2}$/.test(input[k]));
  if (badT) return toast('Verifică ora „' + input[badT] + '”. Scrie de forma 19:30.', 4000);
  if (input.status === 'Opțiune' && (!e || e.status !== 'Opțiune') && (!input.optiunePana || input.optiunePana < optMin(input.data))) {
    input.optiunePana = optMin(input.data); if ($('f_optiunePana')) $('f_optiunePana').value = input.optiunePana;
    toast('Rezervarea ține minim ' + ZILE_OPTIUNE + ' zile: până ' + shortDay(input.optiunePana) + '.', 3500);
  }
  const o = { force: force };
  if (e) o.expectedModified = e.modificatLa;
  else if ($('r_mode') && $('r_mode').value) o.repeat = { mode: $('r_mode').value, count: Number($('r_count').value) || 1 };
  submit._last = { e: e, input: input, repeat: o.repeat };
  call('saveEvent', [input, o], r => {
    if (r.error) return toast(r.error, 4500);
    if (r.staleEdit) {
      replaceEvent(r.current);
      toast('Între timp ' + nameOf(r.current.modificatDe) + ' a modificat evenimentul. Am încărcat versiunea nouă; refă modificarea.', 6000);
      return openForm(r.current);
    }
    if (r.needsConfirm) return showConflicts(r.conflicts, e);
    if (r.unchanged) { toast('Nimic de salvat'); return openDetail(e.id); }
    r.events.forEach(replaceEvent);
    mergeById(S.data.tasks, r.tasks);
    render();
    // după salvare deschidem fișa, ca să se vadă clar că evenimentul e în calendar, oricât de departe ar fi data
    const first = r.events[0];
    openDetail(first.id);
    toast(r.events.length > 1 ? 'Am adăugat ' + r.events.length + ' evenimente, primul ' + shortDay(first.data) + ' ' + first.data.slice(0, 4)
      : (e ? 'Salvat' : 'Salvat în calendar: ' + longDate(first.data)), 4000);
  });
}

function showConflicts(list, e) {
  const saved = submit._last.input;
  const html = list.map(c => `<div class="conf"><b>${esc(shortDate(c.data))} · ${esc(timeRange(c))}</b> · ${esc(c.spatiu)}<br>${esc(shown(c.titlu))} ${statusBadge(c)}${c.responsabil ? ' · ' + esc(c.responsabil) : ''}${c.motiv ? `<br><b style="color:var(--rust)">Om dublat: ${esc(c.motiv)}</b>` : ''}${c.pauza ? `<br><b style="color:var(--amber)">${esc(c.pauza)}</b>` : ''}</div>`).join('');
  const back = $('sheet').innerHTML;
  openSheet(`<h3>Se suprapune cu ${list.length === 1 ? 'un eveniment' : list.length + ' evenimente'}</h3>
    <p style="margin-top:0;color:var(--muted)">În același spațiu și interval (inclusiv montaj, demontaj și pauza de pregătire dintre evenimente), sau același om de la noi prins în două locuri:</p>${html}
    <div class="actions"><button class="btn sec" id="cBack">Înapoi la formular</button><button class="btn pri" id="cForce">Salvează oricum</button></div>`);
  $('cBack').onclick = () => { restoreForm(back, saved, e); };
  $('cForce').onclick = () => { restoreForm(back, saved, e); submit(e, true); };
}

function restoreForm(html, values, e) {
  $('sheet').innerHTML = html; enhanceTimes($('sheet'));
  Object.keys(values).forEach(k => { const el = $('f_' + k); if (el) el.value = shown(values[k]); });
  const rp = submit._last.repeat;
  if (rp && $('r_mode')) { $('r_mode').value = rp.mode; $('r_count').value = rp.count; }
  $('fCancel').onclick = () => e ? openDetail(e.id) : closeSheet();
  $('fSave').onclick = () => submit(e, false);
  const mods = String(values.module || '').split(',');
  if ($('modsBox')) $('modsBox').querySelectorAll('input').forEach(i => i.checked = mods.includes(i.value));
  bindOptBox();
  bindMods(false, values);
}

function replaceEvent(ev) {
  const i = S.data.events.findIndex(x => x.id === ev.id);
  if (ev.arhivat === 'DA') { if (i >= 0) S.data.events.splice(i, 1); return; }
  if (i >= 0) S.data.events[i] = ev; else S.data.events.push(ev);
}

      <li>Derulează și alege <span class="ic">${ICON_PLUS}</span> <b>Adaugă pe ecranul principal</b>.</li>
      <li>Apasă <b>Adaugă</b>, sus în dreapta. Gata: deschizi calendarul de pe ecran.</li></ol>` + btns(null) + (/CriOS/.test(ua) ? '' : '<div class="arrow">↓</div>');
  if (isAndroid) return head + `<ol>
      <li>Apasă meniul <span class="ic">${ICON_DOTS}</span> din dreapta-sus al browserului.</li>
      <li>Alege <b>Instalează aplicația</b> sau <b>Adaugă pe ecranul de pornire</b>.</li>
      <li>Confirmă. Iconița cu steaua apare pe ecran.</li></ol>` + btns(null);
  return head + `<ol><li>În Chrome sau Edge, apasă iconița de instalare din bara de adrese (un monitor cu săgeată) sau meniul ⋮ → <b>Instalează</b>.</li>
      <li>Pe telefon: deschide același link și urmează pașii care apar.</li></ol>` + btns(null);
}
function showInstall() {
  const box = $('inst');
  box.innerHTML = installHtml(); box.classList.add('show');
  $('instNo').onclick = () => { box.classList.remove('show'); store.set(INST_KEY, String(Date.now() + 3 * 86400000)); };
  const go = $('instGo');
  if (go) go.onclick = async () => {
    if (inApp) { try { await navigator.clipboard.writeText(location.origin + location.pathname); toast('Link copiat'); } catch (_) { prompt('Copiază linkul:', location.origin + location.pathname); } return; }
    if (deferredPrompt) { deferredPrompt.prompt(); const r = await deferredPrompt.userChoice; deferredPrompt = null; box.classList.remove('show'); if (r && r.outcome === 'accepted') $('btnInstall').style.display = 'none'; }
  };
}
function maybeInstall() {
  if (isStandalone() || !TOKEN) return;
  $('btnInstall').style.display = '';
  const later = Number(store.get(INST_KEY) || 0);
  if ((isIOS || isAndroid || deferredPrompt) && Date.now() > later) showInstall();
}
$('btnInstall').onclick = showInstall;

$('btnOut').onclick = () => { if (confirm('Ieși din cont pe acest dispozitiv?')) logout(); };
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }

(function boot() {
  const m = /^#e=([^&]+)/.exec(location.hash || '');
  if (m) { try { sessionStorage.setItem('rcal.open', decodeURIComponent(m[1])); } catch (_) {} history.replaceState(null, '', location.pathname + location.search); }
  const r = consumeRedirect();
  TOKEN = (r && r.token) || savedToken();
  if (!TOKEN) {
    if (!r && store.get(HINT_KEY)) { startLogin(true); return; }
    loginScreen(r && r.error && r.error !== 'access_denied' && r.error !== 'interaction_required' && r.error !== 'login_required' ? 'Autentificarea nu a reușit. Încearcă din nou.' : '');
    return;
  }
  load(false);
  setTimeout(maybeInstall, 1500);
})();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.onGisLoad && window.onGisLoad()"></script>
